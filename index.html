<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>
    Controle de Estoque • Marília de Dirceu
  </title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      overflow-x:hidden;

      background:
      linear-gradient(
        135deg,
        #f3e8ff,
        #faf5ff,
        #ede9fe
      );

      min-height:100vh;
      transition:.3s;
    }

    .glass{
      backdrop-filter:blur(12px);
      background:rgba(255,255,255,.75);
    }

    .fade{
      animation:fade .3s ease;
    }

    @keyframes fade{

      from{
        opacity:0;
        transform:translateY(10px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .pulse{
      animation:pulse 1.5s infinite;
    }

    @keyframes pulse{

      0%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.03);
      }

      100%{
        transform:scale(1);
      }

    }

    .scroll-custom::-webkit-scrollbar{
      width:8px;
      height:8px;
    }

    .scroll-custom::-webkit-scrollbar-thumb{
      background:#7e22ce;
      border-radius:999px;
    }

    table{
      min-width:1400px;
    }

    tr:nth-child(even){
      background:#fafafa;
    }

    .toast{
      position:fixed;
      top:20px;
      right:20px;
      background:#16a34a;
      color:#fff;
      padding:18px 25px;
      border-radius:18px;
      font-weight:700;
      z-index:999;
      box-shadow:0 15px 40px rgba(0,0,0,.15);
      opacity:0;
      transform:translateY(-20px);
      transition:.3s;
    }

    .toast.show{
      opacity:1;
      transform:translateY(0);
    }

    /* DARK MODE COMPLETO */

    .dark-mode{
      background:
      linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #111827
      ) !important;

      color:white !important;
    }

    .dark-mode *{
      color:white;
    }

    .dark-mode .glass{
      background:rgba(15,23,42,.95) !important;
      border-color:#334155 !important;
    }

    .dark-mode .bg-white{
      background:#111827 !important;
      color:white !important;
    }

    .dark-mode input{
      background:#0f172a !important;
      color:white !important;
      border-color:#475569 !important;
    }

    .dark-mode table{
      background:#111827 !important;
    }

    .dark-mode tr{
      background:#111827 !important;
    }

    .dark-mode tr:nth-child(even){
      background:#172033 !important;
    }

    .dark-mode tr:hover{
      background:#243047 !important;
    }

    .dark-mode td{
      background:transparent !important;
      color:white !important;
    }

    .dark-mode p{
      color:#cbd5e1 !important;
    }

    .dark-mode th{
      color:white !important;
    }

    .dark-mode .text-gray-500{
      color:#cbd5e1 !important;
    }

    .card-click{
      cursor:pointer;
      transition:.3s;
    }

    .card-click:hover{
      transform:translateY(-3px);
    }

  </style>

</head>

<body>

<div id="toast" class="toast">
  Alterações salvas com sucesso
</div>

<!-- LOGIN -->

<div
  id="loginTela"
  class="
    fixed
    inset-0
    bg-black/80
    flex
    items-center
    justify-center
    z-50
    p-4
  "
>

  <div class="
    bg-white
    rounded-3xl
    shadow-2xl
    p-8
    w-full
    max-w-md
    fade
  ">

    <div class="flex justify-center">

      <div class="
        w-32
        h-32
        rounded-full
        overflow-hidden
        border-4
        border-purple-700
        shadow-2xl
      ">

        <img
          src="imagens (76).jpeg"
          class="w-full h-full object-cover"
        >

      </div>

    </div>

    <h1 class="
      text-4xl
      font-black
      text-center
      text-purple-700
      mt-6
    ">

      Controle de Estoque

    </h1>

    <p class="
      text-center
      text-gray-500
      mt-2
    ">

      Marília de Dirceu

    </p>

    <div class="mt-8 relative">

      <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
        class="
          w-full
          border-2
          border-purple-300
          rounded-2xl
          px-5
          py-4
          outline-none
          focus:border-purple-700
        "
      >

      <button
        onclick="mostrarSenha()"
        class="
          absolute
          right-4
          top-4
          text-purple-700
        "
      >

        👁️

      </button>

    </div>

    <button
      onclick="verificarSenha()"
      class="
        w-full
        mt-5
        bg-purple-700
        hover:bg-purple-800
        transition
        text-white
        py-4
        rounded-2xl
        font-black
        shadow-xl
      "
    >

      ENTRAR

    </button>

    <p
      id="erroSenha"
      class="
        hidden
        text-center
        text-red-600
        font-bold
        mt-4
      "
    ></p>

  </div>

</div>

<!-- SISTEMA -->

<div id="sistema" class="hidden">

  <header class="
    glass
    sticky
    top-0
    z-40
    border-b
    border-purple-100
    shadow-xl
  ">

    <div class="max-w-7xl mx-auto px-4 py-3">

      <div class="
        flex
        flex-wrap
        gap-4
        items-center
        justify-between
      ">

        <div class="flex items-center gap-4">

          <div class="
            w-16
            h-16
            rounded-full
            overflow-hidden
            border-2
            border-purple-700
            shadow-xl
          ">

            <img
              src="imagens (76).jpeg"
              class="w-full h-full object-cover"
            >

          </div>

          <div>

            <h1 class="
              text-2xl
              font-black
              text-purple-700
            ">

              Controle de Estoque

            </h1>

            <p class="text-gray-500">

              Marília de Dirceu

            </p>

          </div>

        </div>

        <div class="
          flex
          flex-wrap
          gap-2
          items-center
        ">

          <div
            id="relogio"
            class="
              bg-white
              px-4
              py-2
              rounded-2xl
              shadow-lg
              font-bold
            "
          ></div>

          <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar..."
            class="
              border-2
              border-purple-300
              rounded-2xl
              px-4
              py-3
              outline-none
              focus:border-purple-700
            "
          >

          <button
            onclick="salvarDados()"
            class="
              bg-green-600
              hover:bg-green-700
              text-white
              px-5
              py-3
              rounded-2xl
              font-black
              shadow-xl
            "
          >

            SALVAR

          </button>

          <button
            onclick="exportarExcel()"
            class="
              bg-blue-600
              hover:bg-blue-700
              text-white
              px-5
              py-3
              rounded-2xl
              font-black
              shadow-xl
            "
          >

            EXCEL

          </button>

          <button
            onclick="toggleDarkMode()"
            class="
              bg-black
              hover:bg-gray-800
              text-white
              px-5
              py-3
              rounded-2xl
              font-black
              shadow-xl
            "
          >

            🌙

          </button>

        </div>

      </div>

    </div>

  </header>

  <main class="max-w-7xl mx-auto p-4">

    <!-- CARDS -->

    <div class="
      grid
      grid-cols-1
      md:grid-cols-3
      gap-5
      mb-5
    ">

      <div class="
        bg-white
        rounded-3xl
        shadow-2xl
        p-6
      ">

        <div class="flex justify-between items-center">

          <div>

            <p class="text-gray-500 font-bold">
              Total Produtos
            </p>

            <h2
              id="totalProdutos"
              class="
                text-5xl
                font-black
                text-purple-700
                mt-3
              "
            >
              0
            </h2>

          </div>

          <i
            data-lucide="boxes"
            class="w-12 h-12 text-purple-700"
          ></i>

        </div>

      </div>

      <div class="
        bg-white
        rounded-3xl
        shadow-2xl
        p-6
      ">

        <div class="flex justify-between items-center">

          <div>

            <p class="text-gray-500 font-bold">
              Estoque Atual
            </p>

            <h2
              id="estoqueTotal"
              class="
                text-5xl
                font-black
                text-green-700
                mt-3
              "
            >
              0
            </h2>

          </div>

          <i
            data-lucide="warehouse"
            class="w-12 h-12 text-green-700"
          ></i>

        </div>

      </div>

      <!-- CARD BAIXOS -->

      <div
        onclick="mostrarBaixos()"
        class="
          bg-white
          rounded-3xl
          shadow-2xl
          p-6
          card-click
        "
      >

        <div class="flex justify-between items-center">

          <div>

            <p class="text-gray-500 font-bold">
              Produtos Baixos
            </p>

            <h2
              id="produtosBaixos"
              class="
                text-5xl
                font-black
                text-red-700
                mt-3
              "
            >
              0
            </h2>

          </div>

          <i
            data-lucide="triangle-alert"
            class="w-12 h-12 text-red-700"
          ></i>

        </div>

      </div>

    </div>

    <div class="mb-5 flex gap-3 flex-wrap">

      <button
        onclick="adicionarProduto()"
        class="
          bg-purple-700
          hover:bg-purple-800
          transition
          text-white
          px-6
          py-4
          rounded-2xl
          font-black
          shadow-xl
        "
      >

        + ADICIONAR PRODUTO

      </button>

      <button
        onclick="renderizarTabela(produtos)"
        class="
          bg-gray-800
          hover:bg-black
          transition
          text-white
          px-6
          py-4
          rounded-2xl
          font-black
          shadow-xl
        "
      >

        MOSTRAR TODOS

      </button>

    </div>

    <!-- TABELA -->

    <div class="
      bg-white
      rounded-3xl
      shadow-2xl
      overflow-hidden
    ">

      <div class="overflow-x-auto scroll-custom">

        <table class="w-full">

          <thead>

            <tr class="
              bg-purple-700
              text-white
              text-sm
            ">

              <th class="p-5 text-left">N°</th>
              <th class="p-5 text-left">Produto</th>
              <th class="p-5 text-center">Entrada</th>
              <th class="p-5 text-center">Saída</th>
              <th class="p-5 text-center">Estoque</th>
              <th class="p-5 text-center">Mínimo</th>
              <th class="p-5 text-center">Status</th>

            </tr>

          </thead>

          <tbody id="tabelaProdutos"></tbody>

        </table>

      </div>

    </div>

  </main>

</div>

<script>

  lucide.createIcons();

  let tentativas = 0;

  if(localStorage.getItem("logado") === "sim"){

    document.getElementById("loginTela")
      .style.display = "none";

    document.getElementById("sistema")
      .classList.remove("hidden");

  }

  function mostrarSenha(){

    const input =
      document.getElementById("senha");

    input.type =
      input.type === "password"
      ? "text"
      : "password";

  }

  function verificarSenha(){

    const senha =
      document.getElementById("senha").value;

    if(senha === "007"){

      localStorage.setItem("logado","sim");

      document.getElementById("loginTela")
        .style.display = "none";

      document.getElementById("sistema")
        .classList.remove("hidden");

    }else{

      tentativas++;

      const erro =
        document.getElementById("erroSenha");

      erro.classList.remove("hidden");

      erro.innerHTML =
      "Senha incorreta.";

      if(tentativas >= 3){

        erro.innerHTML =
        "Sistema bloqueado temporariamente.";

      }

    }

  }

  setInterval(()=>{

    const agora = new Date();

    document.getElementById("relogio")
      .innerHTML =
      agora.toLocaleString("pt-BR");

  },1000);

  let produtos =
    JSON.parse(
      localStorage.getItem("estoqueProdutos")
    );

  if(!produtos){

    produtos = [];

    for(let i = 1; i <= 70; i++){

      produtos.push({

        id:i,
        nome:"Produto " + i,
        entradaHoje:"",
        saidaHoje:"",
        estoqueAtual:0,
        estoqueMinimo:10

      });

    }

  }

  const tabela =
    document.getElementById("tabelaProdutos");

  function renderizarTabela(lista){

    tabela.innerHTML = "";

    let estoqueTotal = 0;

    let baixos = 0;

    lista.forEach((produto,index)=>{

      const entrada =
        parseFloat(produto.entradaHoje) || 0;

      const saida =
        parseFloat(produto.saidaHoje) || 0;

      const estoqueFinal =
        produto.estoqueAtual +
        entrada -
        saida;

      estoqueTotal += estoqueFinal;

      const baixo =
        estoqueFinal <= produto.estoqueMinimo;

      if(baixo){
        baixos++;
      }

      tabela.innerHTML += `

        <tr class="
          border-b
          transition
          ${baixo ? 'bg-red-50' : ''}
        ">

          <td class="p-4 font-black">
            ${produto.id}
          </td>

          <td class="p-4">

            <input
              type="text"
              value="${produto.nome}"
              onchange="editarNome(${produto.id},this.value)"
              class="
                w-full
                border
                rounded-2xl
                px-4
                py-3
              "
            >

          </td>

          <td class="p-4 text-center">

            <input
              type="number"
              min="0"
              value="${produto.entradaHoje}"
              onchange="editarEntrada(${produto.id},this.value)"
              class="
                w-28
                border
                rounded-2xl
                px-4
                py-3
                text-center
              "
            >

          </td>

          <td class="p-4 text-center">

            <input
              type="number"
              min="0"
              value="${produto.saidaHoje}"
              onchange="editarSaida(${produto.id},this.value)"
              class="
                w-28
                border
                rounded-2xl
                px-4
                py-3
                text-center
              "
            >

          </td>

          <td class="
            p-4
            text-center
            font-black
            text-2xl
            ${baixo ? 'text-red-700' : 'text-green-700'}
          ">

            ${estoqueFinal}

          </td>

          <td class="p-4 text-center">

            <input
              type="number"
              min="0"
              value="${produto.estoqueMinimo}"
              onchange="editarMinimo(${produto.id},this.value)"
              class="
                w-24
                border-2
                border-purple-300
                rounded-2xl
                px-4
                py-3
                text-center
                font-black
              "
            >

          </td>

          <td class="p-4 text-center">

            ${
              baixo
              ?
              `
              <span class="
                bg-red-600
                pulse
                text-white
                px-5
                py-3
                rounded-full
                font-black
                shadow-xl
              ">
                REPOSIÇÃO
              </span>
              `
              :
              `
              <span class="
                bg-green-600
                text-white
                px-5
                py-3
                rounded-full
                font-black
                shadow-xl
              ">
                DISPONÍVEL
              </span>
              `
            }

          </td>

        </tr>

      `;

    });

    /* CORREÇÃO TOTAL PRODUTOS */

    document.getElementById("totalProdutos")
      .innerHTML = produtos.length;

    document.getElementById("estoqueTotal")
      .innerHTML = estoqueTotal;

    document.getElementById("produtosBaixos")
      .innerHTML = produtos.filter(produto=>{

        const entrada =
          parseFloat(produto.entradaHoje) || 0;

        const saida =
          parseFloat(produto.saidaHoje) || 0;

        const estoque =
          produto.estoqueAtual +
          entrada -
          saida;

        return estoque <= produto.estoqueMinimo;

      }).length;

  }

  function encontrarProduto(id){

    return produtos.find(
      produto => produto.id === id
    );

  }

  function editarNome(id,valor){

    encontrarProduto(id).nome = valor;

  }

  function editarEntrada(id,valor){

    encontrarProduto(id).entradaHoje = valor;

    renderizarTabela(produtos);

  }

  function editarSaida(id,valor){

    encontrarProduto(id).saidaHoje = valor;

    renderizarTabela(produtos);

  }

  function editarMinimo(id,valor){

    encontrarProduto(id).estoqueMinimo =
      parseFloat(valor) || 0;

    renderizarTabela(produtos);

  }

  function salvarDados(){

    produtos.forEach(produto=>{

      produto.estoqueAtual =

        produto.estoqueAtual +

        (parseFloat(produto.entradaHoje) || 0)

        -

        (parseFloat(produto.saidaHoje) || 0);

      produto.entradaHoje = "";

      produto.saidaHoje = "";

    });

    localStorage.setItem(
      "estoqueProdutos",
      JSON.stringify(produtos)
    );

    renderizarTabela(produtos);

    mostrarToast();

  }

  setInterval(()=>{

    localStorage.setItem(
      "estoqueProdutos",
      JSON.stringify(produtos)
    );

  },3000);

  function mostrarToast(){

    const toast =
      document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(()=>{

      toast.classList.remove("show");

    },3000);

  }

  document.getElementById("pesquisa")
    .addEventListener("input",function(){

      const valor =
        this.value.toLowerCase();

      const filtrados =
        produtos.filter(produto=>{

          return(

            produto.nome
              .toLowerCase()
              .includes(valor)

            ||

            produto.id
              .toString()
              .includes(valor)

          );

        });

      renderizarTabela(filtrados);

    });

  function adicionarProduto(){

    produtos.push({

      id:produtos.length + 1,
      nome:"",
      entradaHoje:"",
      saidaHoje:"",
      estoqueAtual:0,
      estoqueMinimo:10

    });

    renderizarTabela(produtos);

    mostrarToast();

  }

  /* MOSTRAR SOMENTE BAIXOS */

  function mostrarBaixos(){

    const baixos =
      produtos.filter(produto=>{

        const entrada =
          parseFloat(produto.entradaHoje) || 0;

        const saida =
          parseFloat(produto.saidaHoje) || 0;

        const estoque =
          produto.estoqueAtual +
          entrada -
          saida;

        return estoque <= produto.estoqueMinimo;

      });

    renderizarTabela(baixos);

  }

  function exportarExcel(){

    const dados = produtos.map(produto=>{

      const entrada =
        parseFloat(produto.entradaHoje) || 0;

      const saida =
        parseFloat(produto.saidaHoje) || 0;

      const estoque =
        produto.estoqueAtual +
        entrada -
        saida;

      return {

        "N°": produto.id,
        "Produto": produto.nome,
        "Entrada": entrada,
        "Saída": saida,
        "Estoque Atual": estoque,
        "Estoque Mínimo": produto.estoqueMinimo,
        "Status":
          estoque <= produto.estoqueMinimo
          ? "REPOSIÇÃO"
          : "DISPONÍVEL"

      };

    });

    const ws =
      XLSX.utils.json_to_sheet(
        dados,
        {origin:"A4"}
      );

    XLSX.utils.sheet_add_aoa(
      ws,
      [[
        "CONTROLE DE ESTOQUE • MARÍLIA DE DIRCEU"
      ]],
      {origin:"A1"}
    );

    ws["!cols"] = [

      {wch:8},
      {wch:35},
      {wch:15},
      {wch:15},
      {wch:20},
      {wch:20},
      {wch:20}

    ];

    ws["!merges"] = [
      {
        s:{r:0,c:0},
        e:{r:0,c:6}
      }
    ];

    const wb =
      XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      "Estoque"
    );

    XLSX.writeFile(
      wb,
      "Controle_Estoque_Marilia.xlsx"
    );

  }

  function toggleDarkMode(){

    document.body.classList
      .toggle("dark-mode");

  }

  document.getElementById("senha")
    .addEventListener("keypress",function(e){

      if(e.key === "Enter"){
        verificarSenha();
      }

    });

  renderizarTabela(produtos);

</script>

</body>

</html>
